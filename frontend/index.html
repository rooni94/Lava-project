<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LAVA | حلول البرمجيات</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet" />
  </head>
  <body class="font-cairo bg-surface text-secondary">
    <div id="root"></div>
    <script>
      const isLocalHost = /^(localhost|127\.0\.0\.1)$/i.test(window.location.hostname);
      const params = new URLSearchParams(window.location.search);
      const forceCacheFlush = params.get("flush-cache") === "1";
      const SW_VERSION = "v3";

      const clearLavaCaches = () => {
        if (!("caches" in window)) return Promise.resolve();
        return caches.keys().then((keys) => Promise.all(keys.filter((key) => key.startsWith("lava-")).map((key) => caches.delete(key))));
      };

      const unregisterAllServiceWorkers = () => {
        if (!("serviceWorker" in navigator)) return Promise.resolve();
        return navigator.serviceWorker.getRegistrations().then((regs) => Promise.all(regs.map((reg) => reg.unregister())));
      };

      if ("serviceWorker" in navigator) {
        if (isLocalHost || forceCacheFlush) {
          unregisterAllServiceWorkers()
            .then(() => clearLavaCaches())
            .then(() => {
              if (forceCacheFlush) {
                params.delete("flush-cache");
                const query = params.toString();
                const nextUrl = window.location.pathname + (query ? `?${query}` : "") + window.location.hash;
                window.location.replace(nextUrl);
              }
            });
        } else if (window.location.protocol === "https:") {
          navigator.serviceWorker
            .register(`/service-worker.js?v=${SW_VERSION}`)
            .then((registration) => registration.update())
            .catch(() => {});
        }
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
