version: "3.9"

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: lava
      POSTGRES_USER: lava
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    command: gunicorn lava.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - ./backend:/app
      - media:/app/media
    environment:
      DATABASE_URL: ${DATABASE_URL}
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      ALLOWED_HOSTS: localhost,127.0.0.1
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: "False"
      SECURE_SSL_REDIRECT: "False"
    depends_on:
      - db
      - redis
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  pgdata:
  media:
