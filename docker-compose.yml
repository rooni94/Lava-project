version: "3.9"

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-lava}"
      POSTGRES_USER: "${POSTGRES_USER:-lava}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    command: daphne -b 0.0.0.0 -p 8000 lava.asgi:application
    volumes:
      - ./backend:/app
      - media:/app/media
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-lava}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-lava}"
      REDIS_URL: "${REDIS_URL:-redis://redis:6379/0}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-http://localhost:5173}"
      ALLOWED_HOSTS: "${ALLOWED_HOSTS:-localhost,127.0.0.1}"
      SECRET_KEY: "${SECRET_KEY:?Set SECRET_KEY in .env}"
      DEBUG: "${DEBUG:-False}"
      SECURE_SSL_REDIRECT: "False"
      MEDIA_WATERMARK_ENABLED: "True"
      MEDIA_WATERMARK_IMAGE_PATH: "static/watermarks/logo.png"
      MEDIA_WATERMARK_IMAGE_SCALE: "0.18"
      MEDIA_WATERMARK_OPACITY: "0.35"
      MEDIA_IMAGE_MAX_SIDE: "1920"
      MEDIA_IMAGE_QUALITY: "92"
    depends_on:
      - db
      - redis
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  pgdata:
  media:
