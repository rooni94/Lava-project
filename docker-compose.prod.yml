services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-lava}"
      POSTGRES_USER: "${POSTGRES_USER:-lava}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7
    restart: unless-stopped

  backend:
    build: ./backend
    command: daphne -b 0.0.0.0 -p 8000 lava.asgi:application
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-lava}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-lava}"
      SECRET_KEY: "${SECRET_KEY:?Set SECRET_KEY in .env}"
      REDIS_URL: "${REDIS_URL:-redis://redis:6379/0}"
    volumes:
      - media:/app/media
      - staticfiles:/app/staticfiles
    depends_on:
      - db
      - redis
    expose:
      - "8000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    expose:
      - "80"
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_www:/var/www/certbot
      - certbot_etc:/etc/letsencrypt
      - media:/var/www/media:ro
      - staticfiles:/var/www/static:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_etc:/etc/letsencrypt

volumes:
  pgdata:
  media:
  staticfiles:
  certbot_www:
  certbot_etc:
